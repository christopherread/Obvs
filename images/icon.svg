<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32">
  <!-- Obvs's package icon: an O for Obvs, with messages moving round it, in the site's teal to blue. icon.png is this,
       rendered at 128 by 128 pixels. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e9f8e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#background)"/>
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.6"/>
  <circle cx="16" cy="7.5" r="3.1" fill="#fff"/>
  <circle cx="23.4" cy="20.25" r="3.1" fill="#fff"/>
  <circle cx="8.6" cy="20.25" r="3.1" fill="#fff"/>
</svg>

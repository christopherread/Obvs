version: 2
# Every update goes to v7, where work is done: a pull request merged into master would publish packages. Dependabot
# reads this file from master, so the target takes effect from the release that brings it there.
updates:
  # Library and test packages, versioned centrally in Directory.Packages.props
  - package-ecosystem: nuget
    directory: /
    target-branch: v7
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Obvs.V6InteropApp is a v6 app on the published packages, so it stays on Obvs 6.x
      - dependency-name: "Obvs*"
        update-types: ["version-update:semver-major"]
      # The analyzers and generator are compiled against the oldest compiler they support, which can't load them if
      # they're compiled against a newer one (see Obvs.Analyzers.csproj)
      - dependency-name: "Microsoft.CodeAnalysis.CSharp*"
      # The packages stay on .NET's long-term support release, 10, so an app on it doesn't have to take .NET 11's
      # packages to use Obvs. They move together, as each depends on the others at its own version.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Bcl.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Diagnostics.DiagnosticSource"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Threading.Channels"
        update-types: ["version-update:semver-major"]

  # The examples are built on the published Obvs packages, so keep them on its latest release. They pin their own
  # versions, so this entry updates only theirs. It carried the root's ignores while the examples built Obvs from the
  # repo, which made it update Directory.Packages.props too, and doesn't need them now.
  - package-ecosystem: nuget
    directory: /Examples
    target-branch: v7
    schedule:
      interval: weekly
    groups:
      examples:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: v7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

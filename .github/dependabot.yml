version: 2
updates:
  # Library and test packages, versioned centrally in Directory.Packages.props
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Obvs.V6InteropApp is a v6 app on the published packages, so it stays on Obvs 6.x
      - dependency-name: "Obvs*"
        update-types: ["version-update:semver-major"]

  # The examples pin published Obvs packages, so keep them on the latest release
  - package-ecosystem: nuget
    directory: /Examples
    schedule:
      interval: weekly
    groups:
      examples:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

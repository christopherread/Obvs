services:
  amq:
    image: apache/activemq-classic:6.2.0
    environment:
      # Require the credentials the examples connect with
      - ACTIVEMQ_CONNECTION_USER=admin
      - ACTIVEMQ_CONNECTION_PASSWORD=admin
    ports:
      - "61616:61616"
      - "8161:8161"
    networks:
      - obvs
  obvssvc1:
    build: ./
    image: obvs.example.service.activemq:latest
    environment:
      - ACTIVEMQ_BROKER_URI=tcp://amq:61616?connectionTimeout=0
      - OBVS_SERVICE_NAME=Obvs.Service1
    depends_on:
      - amq
    networks:
      - obvs

networks:
  obvs:
    name: obvs
